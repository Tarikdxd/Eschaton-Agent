[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eschaton-agent"
version = "2.0.0"
description = "Evrensel Antigravity Köprüsü & Yardımcı Ajan Orkestratörü — Qoder, OpenCode vb. dış ajanların bilgisayardaki Antigravity'ye bağlanıp %10 usage korumasıyla onu yönetmesini sağlar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tarık Tozlu" }
]
keywords = ["antigravity", "mcp", "ai-agent", "qoder", "opencode", "orchestrator", "usage-shield"]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
ui = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]

[project.scripts]
eschaton = "eschaton.cli:app"
eschaton-mcp = "eschaton.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eschaton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
