[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eschaton-agent"
version = "1.0.0"
description = "Universal Computer-Controlling Agent (CCA) with Multimodal Vision and LLM Reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tarık Tozlu" }
]
keywords = ["agent", "computer-use", "vision", "automation", "mcp", "llm"]
dependencies = [
    "pydantic>=2.0.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "anthropic>=0.30.0",
    "google-genai>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0"
]

[project.scripts]
eschaton = "eschaton.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eschaton*"]
