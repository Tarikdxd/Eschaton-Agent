<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eschaton</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/vs/loader.js"></script>
    <script>
      require.config({ paths: { vs: '/vs' } })
      window.monacoReady = new Promise(function (resolve) {
        require(['vs/editor/editor.main'], function () {
          resolve(window.monaco)
        })
      })
    </script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="brand"><span class="mark">◆</span> eschaton</div>
        <div class="workspace" id="workspace-name">workspace</div>
        <div class="title-actions">
          <button id="quick-open" class="ghost" title="Quick open (Ctrl+P)">Search files…</button>
        </div>
      </header>

      <main id="body">
        <nav id="activity">
          <button class="activity-btn active" data-view="explorer" title="Explorer">▤</button>
          <button class="activity-btn" data-view="sessions" title="Sessions">◷</button>
          <div class="spacer"></div>
          <button class="activity-btn" id="toggle-ai" title="Toggle assistant">✦</button>
        </nav>

        <aside id="sidebar">
          <div class="sidebar-head">
            <span id="sidebar-title">Explorer</span>
            <button class="ghost tiny" id="refresh-tree" title="Refresh">⟳</button>
          </div>
          <div id="tree" class="tree"></div>
          <div id="sessions" class="tree hidden"></div>
        </aside>

        <section id="editor-area">
          <div id="tabs" class="tabs"></div>
          <div id="editor"></div>
          <div id="welcome" class="welcome">
            <div class="welcome-inner">
              <div class="welcome-mark">◆</div>
              <h1>Eschaton</h1>
              <p>A light IDE with an agent that can edit your files.</p>
              <ul>
                <li><kbd>Ctrl</kbd>+<kbd>P</kbd> quick open</li>
                <li><kbd>Ctrl</kbd>+<kbd>S</kbd> save file</li>
                <li><kbd>Ctrl</kbd>+<kbd>`</kbd> terminal</li>
                <li><kbd>Ctrl</kbd>+<kbd>I</kbd> focus the assistant</li>
              </ul>
            </div>
          </div>
          <div id="panel" class="panel">
            <div class="panel-head">
              <span class="panel-tab active">Terminal</span>
              <button class="ghost tiny" id="clear-terminal" title="Clear">Clear</button>
            </div>
            <div id="terminal"></div>
          </div>
        </section>

        <aside id="ai" class="ai">
          <div class="ai-head">
            <div class="ai-title">Assistant</div>
            <div class="ai-controls">
              <select id="mode" title="Mode">
                <option>Build</option>
                <option>Plan</option>
                <option>Review</option>
                <option>Fast</option>
              </select>
              <button class="ghost tiny" id="new-session" title="New session">＋</button>
            </div>
          </div>
          <div class="ai-session" id="session-line">new session</div>
          <div id="messages" class="messages"></div>
          <div class="composer">
            <textarea id="prompt" rows="3" placeholder="Ask for a change… (Enter to send, Shift+Enter for a new line)"></textarea>
            <div class="composer-actions">
              <span class="hint" id="composer-hint"></span>
              <button id="send" class="primary">Send</button>
            </div>
          </div>
        </aside>
      </main>

      <footer id="statusbar">
        <div class="status-left">
          <span id="status-provider">no model</span>
          <span id="status-session"></span>
        </div>
        <div class="status-right">
          <span id="status-path"></span>
          <span id="status-position"></span>
          <span id="status-language"></span>
        </div>
      </footer>
    </div>

    <div id="quick-open-modal" class="modal hidden">
      <input id="quick-open-input" type="text" placeholder="Search files by name" autocomplete="off" />
      <ul id="quick-open-results"></ul>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
